<VirtualHost *:80>
    ServerName intranet.agrored.com
    DocumentRoot /var/www/agrored.com/intranet

    <Directory /var/www/agrored.com/intranet>
        Require ip 172.16.1.192/26
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/intranet_error.log
    CustomLog ${APACHE_LOG_DIR}/intranet_access.log combined
</VirtualHost>
